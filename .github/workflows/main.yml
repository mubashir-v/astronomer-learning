name: Astro Remote Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd /home/ubuntu/analytics-dag

            git pull origin ${GITHUB_REF_NAME}

            astro dev parse

            if [ "${GITHUB_REF_NAME}" = "develop" ]; then
              astro deploy cmpb7syop87mt01ov0zb1fn0u -d
            fi

            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              astro deploy cmpb7syop87mt01ov0zb1fn0u -d
            fi
