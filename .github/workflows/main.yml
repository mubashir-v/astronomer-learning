name: Astro Remote Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd /home/ubuntu/analytics-dag

            git pull origin ${GITHUB_REF_NAME}

            astro dev parse

            if [ "${GITHUB_REF_NAME}" = "develop" ]; then
              astro deploy --deployment-id cmp74is0w4k9p01orl52t9hc6
            fi

            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              astro deploy --deployment-id cmp74is0w4k9p01orl52t9hc6
            fi
